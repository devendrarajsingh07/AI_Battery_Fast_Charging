<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="AI Battery Fast Charging — reinforcement learning for lithium-ion fast charging">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161d27" stroke-width="1"/>
    </pattern>
    <clipPath id="cell"><rect x="912" y="78" width="132" height="184" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.9"/>

  <!-- text -->
  <text x="64" y="104" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="3">SOFT ACTOR-CRITIC · SINGLE PARTICLE MODEL</text>
  <text x="62" y="166" fill="#e6edf3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700">AI Battery Fast Charging</text>
  <text x="64" y="212" fill="#8b949e" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22">A reinforcement-learning agent that picks the charging current</text>
  <text x="64" y="242" fill="#8b949e" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22">for a lithium-ion cell, step by step — balancing speed, heat and ageing.</text>
  <text x="64" y="286" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1">Research internship · NoonRay Energy Pvt. Ltd.</text>

  <!-- battery -->
  <rect x="954" y="58" width="48" height="16" rx="4" fill="#30363d"/>
  <rect x="904" y="70" width="148" height="200" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="4"/>
  <g clip-path="url(#cell)">
    <rect x="912" y="140" width="132" height="184" fill="url(#fill)">
      <animate attributeName="y" values="244;98;98;244" keyTimes="0;0.7;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M986 104 L950 176 H976 L964 238 L1008 158 H980 L994 104 Z" fill="#e6edf3" opacity="0.92">
    <animate attributeName="opacity" values="0.92;0.55;0.92" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <text x="978" y="300" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">NMC 622 · 3 Ah</text>
</svg>
